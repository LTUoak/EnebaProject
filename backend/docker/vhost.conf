# Apache site configuration used inside the container (see ../Dockerfile).

ServerName localhost

<VirtualHost *:${PORT}>
    # Only the public/ folder is reachable from the web; src/ is not.
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Require all granted
        AllowOverride None
        # Any address that is not a real file (e.g. /api/products) goes to index.php,
        # which is where the API's router takes over.
        FallbackResource /index.php
    </Directory>

    # Make sure the "Authorization: Bearer <token>" header reaches PHP.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    # Send logs to the container's output, where Render's Logs page shows them.
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
